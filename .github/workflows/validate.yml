name: Validate benchmark implementation
on: [push, pull_request]
jobs:
  controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - run: python scripts/verify_atomic_references.py --density-tolerance-sigma 1e-5
      - run: python scripts/verify_public_source_cohort.py --bond-distance-tolerance-A 1e-12
      - run: python scripts/verify_archived_results.py --numeric-tolerance 1e-10
      - run: python scripts/regenerate_report.py --check
      - run: python scripts/verify_site_predictions.py --output results/site_discovery/prediction_verification.json --check
      - run: python scripts/regenerate_site_report.py --check
      - run: python scripts/regenerate_specificity_report.py --check --numeric-tolerance 1e-10
      - run: python scripts/regenerate_pol_report.py --check
      - run: python -m aav_benchmark.additional_method verify-example
      - run: python -m aav_benchmark.haddock_replay
      - run: python scripts/verify_ring_initialization.py
      - run: python scripts/verify_method_protocol_sources.py
      - run: python scripts/verify_qualified_development_replay.py --numeric-tolerance 1e-10
      - run: python scripts/verify_site_experiment.py --numeric-tolerance 1e-10 --surface-area-tolerance 1e-6
      - run: python -m aav_benchmark status
